name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Advisories appear without code changes.
  schedule:
    - cron: "0 6 * * 1"
  # The release workflow runs the same checks before building.
  workflow_call:
    inputs:
      release:
        description: Called from the release workflow, which builds its own bundles
        type: boolean
        default: false

permissions:
  contents: read

# Cancel superseded runs on the same ref
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    name: Frontend (type-check · build · unit tests)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Type-check & build (tsc && vite build)
        run: npm run build

      - name: Upload production frontend build (dist)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-dist
          path: dist/
          retention-days: 14

      - name: Unit tests (Vitest)
        run: npm run test:unit

      - name: Release scripts (shellcheck)
        run: shellcheck scripts/*.sh

  backend:
    name: Rust backend (unit + integration against MongoDB)
    runs-on: ubuntu-24.04
    services:
      # Plain server for document round trips.
      mongo:
        image: mongo:8.0
        ports: ["27017:27017"]
      # Server with authentication for connection-string handling.
      mongo-auth:
        image: mongo:8.0
        ports: ["27018:27017"]
        env:
          MONGO_INITDB_ROOT_USERNAME: ci_admin
          MONGO_INITDB_ROOT_PASSWORD: "p@ss/w:rd!"
    env:
      COMPASS_IT_URI: mongodb://127.0.0.1:27017
      # The password percent-encoded, as it must be in a URI.
      COMPASS_IT_AUTH_URI: mongodb://ci_admin:p%40ss%2Fw%3Ard!@127.0.0.1:27018/?authSource=admin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf libssl-dev libxdo-dev libayatana-appindicator3-dev

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri

      # tauri::generate_context! embeds the frontend; an empty dist is enough to compile.
      - run: mkdir -p dist

      - name: cargo test (unit + integration)
        working-directory: src-tauri
        run: cargo test --locked

  bundle:
    name: Bundle (Linux .deb)
    # Catches what only a real `tauri build` checks, e.g. mismatched Tauri npm/crate versions.
    if: ${{ !inputs.release }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf libssl-dev libxdo-dev libayatana-appindicator3-dev

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
          key: bundle

      - run: npm ci
      - run: npm run tauri build -- --bundles deb

  e2e:
    name: E2E (Playwright · Chromium)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Install Playwright browser (Chromium)
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  audit:
    name: Dependency audit (cargo · npm)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-audit

      - name: cargo audit
        working-directory: src-tauri
        run: cargo audit

      - name: npm audit
        run: npm audit --audit-level=moderate
